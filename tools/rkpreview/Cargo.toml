[package]
name = "rkpreview"
version = "0.1.0"
edition = "2021"

[lib]
name = "rkpreview"
path = "src/lib.rs"

[[bin]]
name = "rkpreview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[profile.release]
strip = true
lto = true
