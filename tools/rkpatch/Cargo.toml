[package]
name = "rkpatch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rkpatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
