[package]
name = "rkpatch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rkpatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
