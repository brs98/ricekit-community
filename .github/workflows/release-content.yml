name: Release Content

on:
  push:
    tags:
      - 'content-v*'

permissions:
  contents: write

jobs:
  content:
    name: Build content tarball + XPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#content-v}"
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Publishing content version $VERSION (schema major $MAJOR)"

      - name: Sanity-check content layout and TOML parse
        run: |
          set -euo pipefail
          MISSING=0
          BROKEN=0

          for dir in themes/*/; do
            if [ ! -f "${dir}theme.toml" ]; then
              echo "::error file=${dir}::missing theme.toml"
              MISSING=$((MISSING + 1))
            fi
          done
          for dir in templates/*/; do
            if [ ! -f "${dir}config.toml" ]; then
              echo "::error file=${dir}::missing config.toml"
              MISSING=$((MISSING + 1))
            fi
          done

          for f in themes/*/theme.toml templates/*/config.toml; do
            python3 -c "import sys, tomllib; tomllib.load(open(sys.argv[1], 'rb'))" "$f" \
              || { echo "::error file=$f::TOML parse failed"; BROKEN=$((BROKEN + 1)); }
          done

          if [ $MISSING -gt 0 ] || [ $BROKEN -gt 0 ]; then
            echo "Aborting: $MISSING missing files, $BROKEN parse errors"
            exit 1
          fi

      - name: Build manifest.json
        run: |
          set -euo pipefail
          THEMES=$(find themes -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort | jq -R . | jq -cs .)
          CONFIGS=$(find templates -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort | jq -R . | jq -cs .)
          PUBLISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > manifest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "schema_major": ${{ steps.version.outputs.major }},
            "themes": ${THEMES},
            "configs": ${CONFIGS},
            "published_at": "${PUBLISHED}"
          }
          EOF
          jq . manifest.json

      - name: Build tarball and checksum
        run: |
          set -euo pipefail
          TAR="ricekit-content-v${{ steps.version.outputs.version }}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "$TAR" themes/ templates/ manifest.json
          sha256sum "$TAR" | awk '{print $1}' > "$TAR.sha256"
          echo "Tarball: $(du -h "$TAR" | cut -f1)"
          echo "SHA256: $(cat "$TAR.sha256")"

      - name: Build Firefox XPI and checksum
        working-directory: extensions/firefox
        run: |
          set -euo pipefail
          make xpi
          XPI=$(ls dist/ricekit-theme-*.xpi)
          sha256sum "$XPI" | awk '{print $1}' > "$XPI.sha256"
          echo "XPI: $(du -h "$XPI" | cut -f1)"
          echo "SHA256: $(cat "$XPI.sha256")"

      - name: Stage release files
        # Flatten the XPI alongside the tarball + manifest so the download step
        # can dump everything into a single dir without nested paths.
        run: |
          set -euo pipefail
          cp extensions/firefox/dist/ricekit-theme-*.xpi .
          cp extensions/firefox/dist/ricekit-theme-*.xpi.sha256 .

      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: |
            ricekit-content-v*.tar.gz
            ricekit-content-v*.tar.gz.sha256
            manifest.json
            ricekit-theme-*.xpi
            ricekit-theme-*.xpi.sha256

  rkpatch_test:
    name: Test rkpatch on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/rkpatch
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked

  rkpatch_build:
    name: Build rkpatch ${{ matrix.target }}
    needs: rkpatch_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/rkpatch
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          ARCHIVE="rkpatch-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "$ARCHIVE" rkpatch
          shasum -a 256 "$ARCHIVE" | awk '{print $1}' > "$ARCHIVE.sha256"
          echo "Built: $(du -h "$ARCHIVE" | cut -f1)"
          echo "SHA256: $(cat "$ARCHIVE.sha256")"

      - uses: actions/upload-artifact@v4
        with:
          name: rkpatch-${{ matrix.target }}
          path: |
            tools/rkpatch/rkpatch-${{ matrix.target }}.tar.gz
            tools/rkpatch/rkpatch-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish release
    # Fan-in: requires every upstream job to succeed. With `fail-fast: false`
    # on the rkpatch_build matrix, a single bad target (e.g. x86_64-darwin
    # toolchain hiccup) lets the other targets keep building, but the release
    # job still won't run. That's the intentional policy — partial releases
    # would silently ship missing binaries, which is worse than a no-op
    # release the maintainer can re-trigger after the fix.
    needs: [content, rkpatch_build]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ricekit Content ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/ricekit-content-v*.tar.gz
            artifacts/ricekit-content-v*.tar.gz.sha256
            artifacts/manifest.json
            artifacts/ricekit-theme-*.xpi
            artifacts/ricekit-theme-*.xpi.sha256
            artifacts/rkpatch-*.tar.gz
            artifacts/rkpatch-*.tar.gz.sha256
