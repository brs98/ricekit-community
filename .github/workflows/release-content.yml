name: Release Content

on:
  push:
    branches:
      - main
    paths:
      - 'themes/**'
      - 'templates/**'
      - 'integrations/**'
      - 'rices/**'
      - 'extensions/**'
      - 'tools/rkpatch/**'

permissions:
  contents: write

jobs:
  metadata:
    name: Compute release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      schema_major: ${{ steps.release.outputs.schema_major }}
    steps:
      - name: Compute date-based release tag
        id: release
        run: |
          set -euo pipefail
          VERSION="2.$(date -u +'%Y%m%d').${GITHUB_RUN_NUMBER}"
          TAG="content-v${VERSION}"
          SCHEMA_MAJOR="2"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "schema_major=$SCHEMA_MAJOR"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing content version $VERSION (schema major $SCHEMA_MAJOR)"

  content:
    name: Build content tarball + extensions
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load release metadata
        id: version
        run: |
          set -euo pipefail
          TAG="${{ needs.metadata.outputs.tag }}"
          VERSION="${{ needs.metadata.outputs.version }}"
          SCHEMA_MAJOR="${{ needs.metadata.outputs.schema_major }}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "schema_major=$SCHEMA_MAJOR"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing content version $VERSION (schema major $SCHEMA_MAJOR)"

      - name: Test release content contract
        run: python3 scripts/test_release_content.py

      - name: Ensure content publication is unblocked
        run: python3 scripts/release_content.py check-publication --root .

      - name: Sanity-check content layout, references, and TOML parse
        run: |
          set -euo pipefail
          python3 scripts/release_content.py validate --root .

      - name: Build tarball and checksum
        run: |
          set -euo pipefail
          TAR="ricekit-content-v${{ steps.version.outputs.version }}.tar.gz"
          PUBLISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/release_content.py build-release \
            --root . \
            --output-dir . \
            --version "${{ steps.version.outputs.version }}" \
            --schema-major "${{ steps.version.outputs.schema_major }}" \
            --published-at "$PUBLISHED"
          echo "Tarball: $(du -h "$TAR" | cut -f1)"
          echo "SHA256: $(cat "$TAR.sha256")"

      - name: Build Firefox XPI and checksum
        working-directory: extensions/firefox
        run: |
          set -euo pipefail
          make xpi
          XPI="dist/ricekit-firefox.xpi"
          sha256sum "$XPI" | awk '{print $1}' > "$XPI.sha256"
          echo "XPI: $(du -h "$XPI" | cut -f1)"
          echo "SHA256: $(cat "$XPI.sha256")"

      - name: Build Chrome ZIP and checksum
        working-directory: extensions/chrome
        run: |
          set -euo pipefail
          make zip
          ZIP="dist/ricekit-chrome.zip"
          sha256sum "$ZIP" | awk '{print $1}' > "$ZIP.sha256"
          echo "ZIP: $(du -h "$ZIP" | cut -f1)"
          echo "SHA256: $(cat "$ZIP.sha256")"

      - name: Stage release files
        # Flatten extension artifacts alongside the tarball + manifest so the
        # download step can dump everything into a single dir without nested
        # paths.
        run: |
          set -euo pipefail
          cp extensions/firefox/dist/ricekit-firefox.xpi .
          cp extensions/firefox/dist/ricekit-firefox.xpi.sha256 .
          cp extensions/chrome/dist/ricekit-chrome.zip .
          cp extensions/chrome/dist/ricekit-chrome.zip.sha256 .

      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: |
            ricekit-content-v*.tar.gz
            ricekit-content-v*.tar.gz.sha256
            manifest.json
            ricekit-firefox.xpi
            ricekit-firefox.xpi.sha256
            ricekit-chrome.zip
            ricekit-chrome.zip.sha256

  rkpatch_test:
    name: Test rkpatch on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/rkpatch
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked

  rkpatch_build:
    name: Build rkpatch ${{ matrix.target }}
    needs: rkpatch_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/rkpatch
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          ARCHIVE="rkpatch-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "$ARCHIVE" rkpatch
          shasum -a 256 "$ARCHIVE" | awk '{print $1}' > "$ARCHIVE.sha256"
          echo "Built: $(du -h "$ARCHIVE" | cut -f1)"
          echo "SHA256: $(cat "$ARCHIVE.sha256")"

      - uses: actions/upload-artifact@v4
        with:
          name: rkpatch-${{ matrix.target }}
          path: |
            tools/rkpatch/rkpatch-${{ matrix.target }}.tar.gz
            tools/rkpatch/rkpatch-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish release
    # Fan-in: requires every upstream job to succeed. With `fail-fast: false`
    # on the rkpatch_build matrix, a single bad target (e.g. x86_64-darwin
    # toolchain hiccup) lets the other targets keep building, but the release
    # job still won't run. That's the intentional policy — partial releases
    # would silently ship missing binaries, which is worse than a no-op
    # release the maintainer can re-trigger after the fix.
    needs: [metadata, content, rkpatch_build]
    runs-on: ubuntu-latest
    concurrency:
      group: content-publication-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Load release metadata
        id: version
        run: |
          set -euo pipefail
          TAG="${{ needs.metadata.outputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          set -euo pipefail
          cargo install git-cliff --version 2.13.1 --locked
          git-cliff --version

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Guard schema-v1 release visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          python3 scripts/release_content.py check-v1-release-window \
            --releases-json "$RUNNER_TEMP/releases.json"

      - name: Create and push release tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error title=Release tag already exists::Tag ${TAG} already exists. Re-run from a later UTC minute or delete the existing tag if it was created by mistake."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Release tag already exists::Tag ${TAG} already exists on origin. Re-run from a later UTC minute or delete the existing tag if it was created by mistake."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Generate release notes and changelog
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --current --strip header --output RELEASE_NOTES.md
          git-cliff --config cliff.toml --output CHANGELOG.md
          echo "Release notes:"
          cat RELEASE_NOTES.md

      - name: Commit changelog to main
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date"
            exit 0
          fi
          git checkout -B "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ricekit Content ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/ricekit-content-v*.tar.gz
            artifacts/ricekit-content-v*.tar.gz.sha256
            artifacts/manifest.json
            artifacts/ricekit-firefox.xpi
            artifacts/ricekit-firefox.xpi.sha256
            artifacts/ricekit-chrome.zip
            artifacts/ricekit-chrome.zip.sha256
            artifacts/rkpatch-*.tar.gz
            artifacts/rkpatch-*.tar.gz.sha256
