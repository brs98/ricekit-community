[metadata]
name = "jankyborders-colors"
author = "ricekit"
version = "1.1.0"
description = "JankyBorders themed window borders with safe startup and live updates"
app = "jankyborders"
category = "wm"
type = "colors"

[target.macos]
path = "~/.config/borders/borders.sh"
strategy = "symlink"

[reload.macos]
command = "bash ~/.config/borders/borders.sh"

[requires]
colors = ["ansi", "semantic"]
