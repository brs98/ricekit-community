[metadata]
name = "spicetify"
author = "ricekit"
version = "1.0.0"
description = "Spicetify color theme for Spotify with live reload"
setup_instructions = """One-time setup:
  1. Copy user.css to your spicetify theme directory:
     mkdir -p ~/.config/spicetify/Themes/ricekit
     cp ~/.config/ricekit/custom-configs/spicetify/user.css ~/.config/spicetify/Themes/ricekit/
  2. Copy the live-reload extension:
     cp ~/.config/ricekit/custom-configs/spicetify/ricekit-live-reload.js ~/.config/spicetify/Extensions/
  3. Configure spicetify:
     spicetify config current_theme ricekit color_scheme ricekit extensions ricekit-live-reload.js
  4. Apply:
     spicetify apply
"""
app = "spicetify"
category = "system"
type = "colors"

[target.macos]
path = "~/.config/spicetify/Themes/ricekit/color.ini"
strategy = "direct"
[target.linux]
path = "~/.config/spicetify/Themes/ricekit/color.ini"
strategy = "direct"

[reload.macos]
command = "sed -i '' 's/= #\\([0-9a-fA-F]\\)/= \\1/g' ~/.config/spicetify/Themes/ricekit/color.ini 2>/dev/null; CSS=/Applications/Spotify.app/Contents/Resources/Apps/xpui/ricekit-live.css; printf ':root {\\n' > \"$CSS\"; awk -F'=' '!/^\\[/ && NF==2 { gsub(/[[:space:]]/, \"\", $1); gsub(/[[:space:]]/, \"\", $2); if ($2 != \"\") printf \"  --spice-%s: #%s !important;\\n\", $1, $2 }' ~/.config/spicetify/Themes/ricekit/color.ini >> \"$CSS\"; printf '}\\n' >> \"$CSS\"; true"
[reload.linux]
command = "sed -i 's/= #\\([0-9a-fA-F]\\)/= \\1/g' ~/.config/spicetify/Themes/ricekit/color.ini 2>/dev/null; CSS=$(find /usr -path '*/spotify*/Apps/xpui' -type d 2>/dev/null | head -1)/ricekit-live.css; printf ':root {\\n' > \"$CSS\"; awk -F'=' '!/^\\[/ && NF==2 { gsub(/[[:space:]]/, \"\", $1); gsub(/[[:space:]]/, \"\", $2); if ($2 != \"\") printf \"  --spice-%s: #%s !important;\\n\", $1, $2 }' ~/.config/spicetify/Themes/ricekit/color.ini >> \"$CSS\"; printf '}\\n' >> \"$CSS\"; true"

[requires]
colors = ["ansi", "semantic"]
