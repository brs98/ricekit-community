[metadata]
name = "spicetify"
author = "ricekit"
version = "1.0.0"
description = "Spicetify color theme for Spotify with live reload"
setup_instructions = """One-time setup:
  1. Copy user.css to your spicetify theme directory:
     mkdir -p ~/.config/spicetify/Themes/ricekit
     cp ~/.config/ricekit/custom-configs/spicetify/user.css ~/.config/spicetify/Themes/ricekit/
  2. Configure spicetify:
     spicetify config current_theme ricekit color_scheme ricekit always_enable_devtools 1
  3. Apply:
     spicetify apply
  Note: spicetify watch -s is auto-managed by the reload command —
  it starts automatically on theme changes if not already running.
"""
app = "spicetify"
category = "system"
type = "colors"

[target.macos]
path = "~/.config/spicetify/Themes/ricekit/color.ini"
strategy = "direct"
[target.linux]
path = "~/.config/spicetify/Themes/ricekit/color.ini"
strategy = "direct"

[reload.macos]
command = "sed -i '' 's/= #\\([0-9a-fA-F]\\)/= \\1/g' ~/.config/spicetify/Themes/ricekit/color.ini 2>/dev/null; pgrep -f 'spicetify watch' >/dev/null 2>&1 || (spicetify watch -s &>/dev/null &); true"
[reload.linux]
command = "sed -i 's/= #\\([0-9a-fA-F]\\)/= \\1/g' ~/.config/spicetify/Themes/ricekit/color.ini 2>/dev/null; pgrep -f 'spicetify watch' >/dev/null 2>&1 || (spicetify watch -s &>/dev/null &); true"

[requires]
colors = ["ansi", "semantic"]
