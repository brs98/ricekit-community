[metadata]
name = "slack-desktop"
author = "ricekit"
version = "0.1.0"
description = "Slack desktop theme variables for Electron CSS injection"
setup_instructions = """macOS setup:
  1. Enable this template and apply your Ricekit theme.
  2. Run:
       rkpatch slack install
  3. Restart Slack.

Recovery:
  Run:
       rkpatch slack restore

Requires the `rkpatch` binary built from `tools/rkpatch/` in the ricekit-community repo and added to PATH. Slack from /Applications is often root-owned; if rkpatch reports a permission error, retry with sudo."""
app = "slack"
category = "system"
type = "colors"

[target.macos]
path = "~/.config/ricekit/active/slack-desktop/ricekit-vars.css"
strategy = "direct"

[requires]
colors = ["ansi", "semantic"]
