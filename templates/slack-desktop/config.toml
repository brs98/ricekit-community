[metadata]
name = "slack-desktop"
author = "ricekit"
version = "0.1.0"
description = "Slack desktop theme variables for Electron CSS injection"
icon_url = "https://raw.githubusercontent.com/brs98/ricekit-community/main/templates/slack-desktop/preview.png"
setup_instructions = """macOS setup:
  1. Enable this template and apply your Ricekit theme.
  2. Run:
       rkpatch slack install
  3. Restart Slack.

On macOS Sequoia (15+), the first install prints a one-line "macOS is blocking in-place edits — relocating to staging" notice. That's expected — rkpatch transparently copies the bundle aside, patches the copy, and atomically swaps it into /Applications. Subsequent installs go in place.

Recovery:
  Run:
       rkpatch slack restore

Requires the `rkpatch` binary built from `tools/rkpatch/` in the ricekit-community repo and added to PATH (`cd tools/rkpatch && cargo install --path .`). If install fails with a filesystem permission error, retry with `sudo rkpatch slack install`."""
app = "slack"
category = "system"
type = "colors"

[target.macos]
path = "~/.config/ricekit/active/slack-desktop/ricekit-vars.css"
strategy = "direct"

[requires]
colors = ["ansi", "semantic"]
