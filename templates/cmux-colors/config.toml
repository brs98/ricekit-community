[metadata]
name = "cmux-colors"
author = "ricekit"
version = "1.0.0"
description = "cmux terminal multiplexer theme colors"
setup_instructions = """cmux uses Ghostty's config format, so the theme is imported via
the same `config-file` directive Ghostty uses.

Run once to clear any built-in cmux theme override:

cmux themes clear

Then add this line to your cmux config (~/Library/Application Support/com.cmuxterm.app/config.ghostty):

config-file = ?~/Library/Application Support/com.cmuxterm.app/ricekit-theme"""
app = "cmux"
category = "terminal"
type = "colors"

[target.macos]
path = "~/Library/Application Support/com.cmuxterm.app/ricekit-theme"
strategy = "symlink"

[reload.macos]
command = "cmux reload-config 2>/dev/null; true"

[requires]
colors = ["ansi"]
