[metadata]
name = "linear-desktop"
author = "ricekit"
version = "0.1.0"
description = "Linear desktop theme variables for Electron CSS injection"
setup_instructions = """macOS setup:
  1. Enable this template and apply your Ricekit theme.
  2. Run:
       node ~/.config/ricekit/custom-configs/linear-desktop/patch.mjs install
  3. Restart Linear.

Recovery:
  Run:
       node ~/.config/ricekit/custom-configs/linear-desktop/patch.mjs restore"""
app = "linear"
category = "productivity"
type = "colors"

[target.macos]
path = "~/.config/ricekit/active/linear-desktop/ricekit-vars.css"
strategy = "direct"

[reload.macos]
command = "osascript -e 'tell application \"Linear\" to quit' >/dev/null 2>&1; for i in 1 2 3 4 5; do pgrep -x Linear >/dev/null || break; sleep 1; done; open -a Linear; true"

[requires]
colors = ["ansi", "semantic"]